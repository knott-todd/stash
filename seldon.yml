version: 1
name: stash
run:
  url: http://localhost:3000   # overridden per run with the public tunnel URL
testCases:
  - name: Zero-config onboarding lands in an empty drive
    id: onboarding
    steps:
      - go to /
      - click the "Switch to Stash in 3 easy steps" button
    criteria: the very next screen is the drive, asking "Where should we start?" with three choices — "Move my Google Drive", "Back up my phone photos" and "Add a file" — and no sign-in, sign-up, email or password form appeared at any point

  - name: Google Drive migration opens Google's own permission page
    id: gdrive-consent
    steps:
      - go to /drive
      - click "Move my Google Drive"
      - click "Allow" in the Stash dialog
      - wait for the next page to load, then stop
    criteria: the next page is hosted by Google (the address begins with accounts.google.com) and is about Google Drive access for Stash

  - name: Added file is encrypted, listed, and opens readable
    id: upload-file
    steps:
      - go to /drive
      - click "Add a sample file" (a link in the welcome text, or a button at the top right if the drive already has files)
      - wait for the confirmation message at the bottom of the page
      - click "Open" next to "Welcome to Stash.txt" (a new tab may open; switch to it)
    criteria: a file named "Welcome to Stash.txt" is listed with its size, today's date and an "encrypted" label, and opening it shows readable text beginning "Welcome to Stash" rather than an error

  - name: File can be renamed and moved to trash with undo
    id: rename-trash-undo
    steps:
      - go to /drive
      - if the drive is empty, click "Add a sample file" and wait for the confirmation
      - right-click the row "Welcome to Stash.txt" (or click the three-dot button at the right of that row) and choose "Rename"
      - type "Lease.txt" and press Enter
      - open the same row's menu again and choose "Move to trash"
      - click "Undo" in the message at the bottom within a few seconds
    criteria: after renaming, the row reads "Lease.txt"; after "Move to trash" the row disappears and a message offers Undo; after clicking Undo the "Lease.txt" row is back in the list

  - name: Pairing a phone shows a scannable code with no sign-in
    id: pair-phone
    steps:
      - go to /drive
      - click "Back up my phone photos" (a tile on the empty drive), or, if the drive has files, click "Open on another device" at the top right and then "Scan with your phone instead"
    criteria: a QR code image appears with text telling the user to point their phone camera at it, and no email, password or account form is required to get it

  # The real /m opens the phone's photo picker, which a test browser can't drive;
  # ?demo=1 is the simulated camera roll used on stage.
  - name: Phone photo backup uploads the camera roll
    id: photo-backup
    steps:
      - go to /m?demo=1
      - click "Back up my photos"
      - wait up to 20 seconds for the count to reach 24 of 24
    criteria: the status card says "All backed up." and every photo thumbnail in the grid has a green check mark
